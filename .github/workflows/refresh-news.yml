name: Refresh news practice

on:
  schedule:
    - cron: "10 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh RSS passages
        run: node scripts/build-news.mjs
      - name: Verify practice logic
        run: node --test tests/practice-core.test.mjs tests/reader-core.test.mjs
      - name: Publish changed passages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh news practice passages"
            git push
          fi
